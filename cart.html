<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020605"
    >

    <title>VOLTRIX — Your Cart</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           VOLTRIX CART
        ===================================================== */

        .cart-page {
            width: min(100%, 900px);
            margin: auto;
            padding: 35px 15px 120px;
        }

        .cart-heading {
            margin-bottom: 25px;
        }

        .cart-heading .section-label {
            margin-bottom: 8px;
        }

        .cart-heading h1 {
            font-family: Georgia, serif;
            font-size: clamp(32px, 9vw, 52px);
            letter-spacing: 2px;
        }

        .cart-heading p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        /* CART ITEMS */

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 92px 1fr;
            gap: 14px;

            padding: 12px;

            border: 1px solid rgba(0,245,160,0.16);
            border-radius: 17px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10,25,20,0.95),
                    rgba(3,9,7,0.95)
                );

            box-shadow:
                0 8px 30px rgba(0,0,0,0.2);
        }

        .cart-image {
            width: 92px;
            height: 105px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 12px;

            background:
                radial-gradient(
                    circle,
                    rgba(0,245,160,0.12),
                    #020605 70%
                );

            border:
                1px solid rgba(0,245,160,0.12);
        }

        .cart-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-image span {
            position: absolute;

            color: #53625e;

            font-size: 7px;
            letter-spacing: 1px;
        }

        .cart-details {
            min-width: 0;
        }

        .cart-details h2 {
            font-size: 15px;
            line-height: 1.35;
            margin-bottom: 7px;
        }

        .cart-price {
            color: var(--emerald);
            font-size: 17px;
            font-weight: 700;
        }

        .cart-old-price {
            margin-left: 7px;
            color: #64716e;
            font-size: 10px;
        }

        .quantity-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 13px;
        }

        .quantity-box {
            display: flex;
            align-items: center;

            border:
                1px solid rgba(0,245,160,0.25);

            border-radius: 9px;

            overflow: hidden;
        }

        .quantity-box button {
            width: 32px;
            height: 32px;

            border: 0;

            background:
                rgba(0,245,160,0.06);

            color: var(--emerald);

            font-size: 18px;
        }

        .quantity-box span {
            width: 34px;

            text-align: center;

            font-size: 13px;
            font-weight: 700;
        }

        .remove-btn {
            border: 0;
            background: transparent;
            color: var(--danger);

            font-size: 9px;
            letter-spacing: 1.5px;
        }

        /* EMPTY CART */

        .empty-cart {
            display: none;

            text-align: center;

            padding: 65px 20px;

            border:
                1px solid rgba(0,245,160,0.15);

            border-radius: 20px;

            background:
                rgba(5,14,11,0.8);
        }

        .empty-cart-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            border:
                1px solid rgba(0,245,160,0.3);

            color: var(--emerald);

            font-size: 28px;

            box-shadow:
                0 0 25px rgba(0,245,160,0.1);
        }

        .empty-cart h2 {
            font-family: Georgia, serif;
            font-size: 28px;
        }

        .empty-cart p {
            margin: 12px 0 25px;
            color: var(--muted);
            font-size: 13px;
        }

        /* SUMMARY */

        .cart-summary {
            margin-top: 25px;

            padding: 22px;

            border:
                1px solid rgba(0,245,160,0.2);

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #07100d,
                    #020605
                );

            box-shadow:
                0 15px 40px rgba(0,0,0,0.3);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            padding: 8px 0;

            color: #aab8b4;

            font-size: 13px;
        }

        .summary-row strong {
            color: white;
        }

        .summary-divider {
            height: 1px;

            margin: 10px 0;

            background:
                rgba(0,245,160,0.18);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;

            padding-top: 8px;

            font-size: 20px;
            font-weight: 700;
        }

        .summary-total span:last-child {
            color: var(--emerald);

            text-shadow:
                0 0 12px rgba(0,245,160,0.3);
        }

        .checkout-btn {
            width: 100%;

            min-height: 54px;

            margin-top: 20px;

            border:
                1px solid var(--emerald);

            border-radius: 12px;

            background:
                var(--emerald);

            color: #00140d;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 3px;

            box-shadow:
                0 0 25px rgba(0,245,160,0.15);

            transition: 0.25s;
        }

        .checkout-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 35px rgba(0,245,160,0.35);
        }

        .continue-shopping {
            display: block;

            text-align: center;

            margin-top: 16px;

            color: #84938f;

            font-size: 10px;

            letter-spacing: 1.5px;
        }

        .continue-shopping:hover {
            color: var(--emerald);
        }

        /* MOBILE */

        @media (max-width: 390px) {

            .cart-item {
                grid-template-columns: 78px 1fr;
            }

            .cart-image {
                width: 78px;
                height: 92px;
            }

            .cart-details h2 {
                font-size: 13px;
            }

            .cart-price {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


<!-- PARTICLES -->

<div id="particles"></div>


<!-- HEADER -->

<header class="topbar">

    <a
        href="index.html"
        class="brand"
    >

        <div class="logo-space">

            <img
                src="assets/logo/voltrix-logo.jpg"
                alt="VOLTRIX"
            >

        </div>

        <span>VOLTRIX</span>

    </a>


    <a
        href="index.html"
        class="outline-btn"
        style="
            min-height:42px;
            padding:0 16px;
            font-size:9px;
        "
    >

        SHOP

    </a>

</header>


<!-- MAIN -->

<main class="cart-page">


    <section class="cart-heading">

        <div class="section-label">
            VOLTRIX
        </div>

        <h1>
            YOUR CART
        </h1>

        <p>
            Review your selected products before checkout.
        </p>

    </section>


    <!-- EMPTY CART -->

    <section
        class="empty-cart"
        id="emptyCart"
    >

        <div class="empty-cart-icon">
            🛒
        </div>

        <h2>
            Your cart is empty
        </h2>

        <p>
            You haven't added anything yet.
        </p>

        <a
            href="index.html#products"
            class="primary-btn"
        >
            START SHOPPING
        </a>

    </section>


    <!-- CART ITEMS -->

    <section
        class="cart-items"
        id="cartItems"
    ></section>


    <!-- SUMMARY -->

    <section
        class="cart-summary"
        id="cartSummary"
    >

        <div class="summary-row">

            <span>
                Subtotal
            </span>

            <strong id="subtotal">
                ₹0
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Delivery
            </span>

            <strong>
                ₹0
            </strong>

        </div>


        <div class="summary-divider"></div>


        <div class="summary-total">

            <span>
                Total
            </span>

            <span id="total">
                ₹0
            </span>

        </div>


        <button
            class="checkout-btn"
            id="checkoutBtn"
            type="button"
        >

            CHECKOUT

        </button>


        <a
            href="index.html#products"
            class="continue-shopping"
        >

            ← CONTINUE SHOPPING

        </a>

    </section>


</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <a
        href="index.html"
        class="bottom-link"
    >

        <div class="bottom-icon">

            <img
                src="assets/icons/home.jpg"
                alt="Home"
            >

        </div>

        <span>
            HOME
        </span>

    </a>


    <a
        href="index.html#categories"
        class="bottom-link"
    >

        <div class="bottom-icon">

            <img
                src="assets/icons/category.jpg"
                alt="Category"
            >

        </div>

        <span>
            CATEGORY
        </span>

    </a>


    <a
        href="cart.html"
        class="bottom-link active"
    >

        <div class="bottom-icon">

            <img
                src="assets/icons/cart.jpg"
                alt="Cart"
            >

        </div>

        <span>
            CART
        </span>

    </a>


    <a
        href="account.html"
        class="bottom-link"
    >

        <div class="bottom-icon">

            <img
                src="assets/icons/account.jpg"
                alt="Account"
            >

        </div>

        <span>
            ACCOUNT
        </span>

    </a>

</nav>


<script>

document.addEventListener("DOMContentLoaded", function () {

    var cartItems = document.getElementById("cartItems");
    var emptyCart = document.getElementById("emptyCart");
    var cartSummary = document.getElementById("cartSummary");

    var subtotalElement = document.getElementById("subtotal");
    var totalElement = document.getElementById("total");

    var checkoutBtn = document.getElementById("checkoutBtn");


    /*
     * Product database.
     * We will expand this later when we create
     * the individual category/product files.
     */

    var products = {

        "gaming-001": {
            name: "Premium Gaming Product",
            price: 999,
            oldPrice: 1499,
            image: "assets/products/gaming/gaming-001.jpg"
        },

        "outfit-001": {
            name: "Premium Outfit",
            price: 999,
            oldPrice: 1499,
            image: "assets/products/outfit/outfit-001.jpg"
        },

        "looksmaxing-001": {
            name: "Premium Care Product",
            price: 999,
            oldPrice: 1499,
            image: "assets/products/looksmaxing/looksmaxing-001.jpg"
        },

        "mobiles-001": {
            name: "Smart Mobile Product",
            price: 999,
            oldPrice: 1499,
            image: "assets/products/mobiles/mobiles-001.jpg"
        }

    };


    function getCart() {

        try {

            var saved =
                localStorage.getItem("voltrixCart");

            if (!saved) {
                return [];
            }

            var cart =
                JSON.parse(saved);

            return Array.isArray(cart)
                ? cart
                : [];

        } catch (error) {

            return [];

        }

    }


    function saveCart(cart) {

        localStorage.setItem(
            "voltrixCart",
            JSON.stringify(cart)
        );

    }


    function formatPrice(price) {

        return "₹" +
            Number(price).toLocaleString("en-IN");

    }


    function renderCart() {

        var cart = getCart();

        cartItems.innerHTML = "";


        if (cart.length === 0) {

            emptyCart.style.display = "block";
            cartSummary.style.display = "none";

            return;

        }


        emptyCart.style.display = "none";
        cartSummary.style.display = "block";


        var subtotal = 0;


        cart.forEach(function (item) {

            var product =
                products[item.id];


            if (!product) {
                return;
            }


            var quantity =
                Number(item.quantity) || 1;


            subtotal +=
                product.price * quantity;


            var card =
                document.createElement("article");

            card.className =
                "cart-item";


            card.innerHTML = `

                <a
                    href="pages/product-${getProductNumber(item.id)}.html"
                    class="cart-image"
                >

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        onerror="this.style.display='none'"
                    >

                    <span>
                        IMAGE
                    </span>

                </a>


                <div class="cart-details">

                    <h2>
                        ${product.name}
                    </h2>

                    <div>

                        <span class="cart-price">
                            ${formatPrice(product.price)}
                        </span>

                        <del class="cart-old-price">
                            ${formatPrice(product.oldPrice)}
                        </del>

                    </div>


                    <div class="quantity-row">

                        <div class="quantity-box">

                            <button
                                type="button"
                                class="minus-btn"
                                data-id="${item.id}"
                            >
                                −
                            </button>

                            <span>
                                ${quantity}
                            </span>

                            <button
                                type="button"
                                class="plus-btn"
                                data-id="${item.id}"
                            >
                                +
                            </button>

                        </div>


                        <button
                            type="button"
                            class="remove-btn"
                            data-id="${item.id}"
                        >
                            REMOVE
                        </button>

                    </div>

                </div>

            `;


            cartItems.appendChild(card);

        });


        subtotalElement.textContent =
            formatPrice(subtotal);

        totalElement.textContent =
            formatPrice(subtotal);


        attachCartEvents();

    }


    function getProductNumber(id) {

        if (id === "gaming-001") {
            return "001";
        }

        if (id === "outfit-001") {
            return "002";
        }

        if (id === "looksmaxing-001") {
            return "003";
        }

        if (id === "mobiles-001") {
            return "004";
        }

        return "001";

    }


    function attachCartEvents() {

        var minusButtons =
            document.querySelectorAll(".minus-btn");

        var plusButtons =
            document.querySelectorAll(".plus-btn");

        var removeButtons =
            document.querySelectorAll(".remove-btn");


        minusButtons.forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    changeQuantity(
                        button.dataset.id,
                        -1
                    );

                }
            );

        });


        plusButtons.forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    changeQuantity(
                        button.dataset.id,
                        1
                    );

                }
            );

        });


        removeButtons.forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    removeProduct(
                        button.dataset.id
                    );

                }
            );

        });

    }


    function changeQuantity(id, amount) {

        var cart = getCart();


        var item =
            cart.find(function (product) {

                return product.id === id;

            });


        if (!item) {
            return;
        }


        item.quantity += amount;


        if (item.quantity < 1) {
            item.quantity = 1;
        }


        saveCart(cart);

        renderCart();

    }


    function removeProduct(id) {

        var cart = getCart();


        cart =
            cart.filter(function (item) {

                return item.id !== id;

            });


        saveCart(cart);

        renderCart();

    }


    checkoutBtn.addEventListener(
        "click",
        function () {

            if (getCart().length === 0) {
                return;
            }

            window.location.href =
                "checkout.html";

        }
    );


    renderCart();

});

</script>


</body>

</html>
